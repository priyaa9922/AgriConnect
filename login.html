<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AgriConnect</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Rancho&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Exact Reference Design Styles */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', sans-serif;
            box-sizing: border-box;
            background: url('agriculture_background.png') center/cover no-repeat fixed;
            position: relative;
            z-index: 0;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: -5%; left: -5%; width: 110%; height: 110%;
            background: inherit;
            filter: blur(15px);
            z-index: -2;
        }

        body::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.2);
            z-index: -1;
        }

        * {
            box-sizing: border-box;
        }

        .login-wrapper {
            width: 900px;
            max-width: 95%;
            height: 600px;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
            display: flex;
            overflow: hidden;
            position: relative;
        }

        /* Left Pane */
        .login-left {
            width: 50%;
            background: url('agriculture_background.png') center/cover no-repeat;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 40px;
            color: white;
        }

        .login-left::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.1), rgba(0,0,0,0.8));
        }

        .login-left-content {
            position: relative;
            z-index: 2;
        }

        .login-left h2 {
            font-family: 'Rancho', cursive;
            font-size: 3em;
            margin: 0 0 10px 0;
            line-height: 1.1;
        }

        .login-left p {
            font-size: 0.9em;
            opacity: 0.9;
            margin: 0;
            max-width: 280px;
        }

        /* Right Pane */
        .login-right {
            width: 50%;
            padding: 30px 40px;
            display: flex;
            flex-direction: column;
            background: #fff;
            overflow: hidden;
        }

        .back-btn {
            text-decoration: none;
            color: #6c757d;
            font-size: 0.8em;
            font-weight: 600;
            margin-bottom: 10px;
            display: inline-block;
            letter-spacing: 1px;
        }

        .welcome-text {
            color: #638ab7;
            font-size: 0.75em;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .login-right h1 {
            color: #0d2b56;
            font-size: 2.2em;
            font-weight: 800;
            line-height: 1.1;
            margin: 0 0 15px 0;
            text-transform: uppercase;
            letter-spacing: -0.5px;
        }

        /* Toggles */
        .toggle-container {
            background: #f1f3f5;
            border-radius: 10px;
            display: flex;
            padding: 4px;
            margin-bottom: 15px;
        }

        .toggle-btn {
            flex: 1;
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.9em;
            font-weight: 600;
            color: #6c757d;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .toggle-btn.active {
            background: #fff;
            color: #0d2b56;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        /* Form Group */
        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            color: #638ab7;
            font-size: 0.7em;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .form-group input {
            width: 100%;
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 0.95em;
            color: #333;
            outline: none;
            transition: border 0.3s;
        }

        .form-group input:focus {
            border-color: #638ab7;
        }

        /* Submit Button */
        .submit-btn {
            width: 100%;
            background: #0d2b56;
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 0.95em;
            font-weight: 600;
            cursor: pointer;
            margin-top: 5px;
            transition: background 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .submit-btn:hover {
            background: #0a2142;
        }

        /* Google Button */
        .google-btn {
            width: 100%;
            background: #fff;
            color: #333;
            border: 1px solid #dee2e6;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.9em;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            transition: background 0.3s;
        }

        .google-btn:hover {
            background: #f8f9fa;
        }

        .google-btn img {
            width: 18px;
        }

        .error-msg {
            color: #dc3545;
            font-size: 0.8em;
            margin-top: 8px;
            display: none;
            font-weight: 500;
        }

        .footer-text {
            text-align: center;
            color: #adb5bd;
            font-size: 0.7em;
            font-weight: 500;
            margin-top: 15px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .login-wrapper {
                flex-direction: column;
                height: auto;
                max-height: 90vh;
                overflow-y: auto;
            }
            .login-left, .login-right {
                width: 100%;
            }
            .login-left {
                height: 200px;
                padding: 20px;
            }
            .login-right {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <div class="login-left">
            <div class="login-left-content">
                <h2>Where Agriculture<br>Thrives</h2>
                <p>Join the ecosystem of modern farmers and digital krushi kendras.</p>
            </div>
        </div>
        <div class="login-right">
            <a href="index.html" class="back-btn">&larr; BACK</a>
            
            <div class="welcome-text">Welcome Back</div>
            <h1 id="mainTitle">LOGIN TO<br>AGRICONNECT.</h1>

            <!-- Action Toggle -->
            <div class="toggle-container" id="actionToggle">
                <div class="toggle-btn active">Login</div>
                <div class="toggle-btn">Sign Up</div>
            </div>

            <!-- Role Toggle -->
            <div class="toggle-container" id="roleToggle">
                <div class="toggle-btn active">👨‍🌾 Farmer</div>
                <div class="toggle-btn">🏪 Shop Owner</div>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="emailInput" placeholder="example@agriconnect.com">
            </div>
            
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="passwordInput" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;">
            </div>

            <button class="submit-btn" id="submitBtn">Enter Workspace &rarr;</button>
            <div class="error-msg" id="errorMsg"></div>

            <button class="google-btn" id="googleBtn">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
                Continue with Google
            </button>

            <div class="footer-text">Protected by AgriConnect Security Protocols.</div>
        </div>
    </div>

    <script type="module" src="auth.js"></script>
</body>
</html>
